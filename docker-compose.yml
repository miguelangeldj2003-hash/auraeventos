version: '3.8'

services:
  mysqldb:
    image: mysql:8.0
    container_name: aura-mysql
    restart: always
    environment:
      MYSQL_DATABASE: aura_eventos
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
    ports:
      - "3306:3306"
    volumes:
      - ./db/aura_eventos.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api/aura-api
      dockerfile: Dockerfile
    container_name: aura-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_CORREO: ${ADMIN_CORREO}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      STORAGE_PATH: ${STORAGE_PATH:-/data/fotos}
    volumes:
      - fotos:/data/fotos
    depends_on:
      mysqldb:
        condition: service_healthy

volumes:
  mysql_data:
  fotos:

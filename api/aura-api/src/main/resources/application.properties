# Servidor Spring Boot
server.port=8080

# Configuración MySQL (Variables de entorno con valores por defecto)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aura_eventos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:aura}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT y Administradora por defecto
aura.jwt.secret=${JWT_SECRET:SuperSecretJwtKeyForAuraEventosApp2026SecureKeyMustBeAtLeast256BitsLong!}
aura.admin.correo=${ADMIN_CORREO:admin@aura.com}
aura.admin.password=${ADMIN_PASSWORD:Admin123!}

# Límite de carga de archivos (máximo 8 MB por foto)
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB
